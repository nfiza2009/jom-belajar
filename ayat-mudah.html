<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jom Belajar - Ayat Mudah</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff3d6, #e8f7ff);
    color: #333;
    text-align: center;
}

header {
    background: white;
    padding: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    color: #666;
}

.game {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.info {
    display: flex;
    justify-content: space-between;
    background: white;
    padding: 15px 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    font-weight: bold;
}

.card,
.result {
    background: white;
    border-radius: 25px;
    padding: 35px 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.emoji {
    font-size: 75px;
}

.instruction {
    font-size: 20px;
    margin: 15px 0;
}

.sentence {
    font-size: 38px;
    font-weight: bold;
    color: #ff7a00;
    line-height: 1.5;
    margin: 25px 10px;
}

.listen {
    border: none;
    background: #6c63ff;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    border: 3px solid #eee;
    background: #fafafa;
    padding: 18px;
    border-radius: 18px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.answer:hover {
    transform: scale(1.03);
}

.answer.correct {
    background: #b9f6c3;
    border-color: #39a852;
}

.answer.wrong {
    background: #ffc5c5;
    border-color: #e74c3c;
}

.feedback {
    min-height: 45px;
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}

.next {
    display: none;
    margin-top: 20px;
    border: none;
    background: #ff9f1c;
    color: white;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

.result {
    display: none;
}

.result h2 {
    font-size: 32px;
}

.result-score {
    font-size: 50px;
    font-weight: bold;
    color: #ff7a00;
    margin: 20px;
}

.replay {
    border: none;
    background: #6c63ff;
    color: white;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

.celebration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    z-index: 10;
}

.celebrate {
    display: flex;
    animation: celebrate 1s ease;
}

@keyframes celebrate {
    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }

    100% {
        opacity: 0;
        transform: scale(1.8);
    }
}

@media (max-width: 600px) {

    .game {
        padding: 15px;
    }

    .sentence {
        font-size: 30px;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .answer {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Jom Baca Ayat!</h1>
    <p>Baca ayat mudah sambil bermain 🎮</p>
</header>

<div class="game">

    <div class="info">
        <div>⭐ Skor: <span id="score">0</span></div>
        <div>Soalan: <span id="questionNumber">1</span>/10</div>
    </div>

    <div class="card" id="gameCard">

        <div class="emoji" id="emoji">⚽</div>

        <div class="instruction">
            Apakah ayat yang betul?
        </div>

        <div class="sentence" id="sentence">
            Ini bola.
        </div>

        <button class="listen" onclick="speakSentence()">
            🔊 Dengar Ayat
        </button>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next" id="nextButton" onclick="nextQuestion()">
            Ayat Seterusnya ➡️
        </button>

    </div>

    <div class="result" id="result">

        <div style="font-size:70px;">🎉</div>

        <h2>Tahniah!</h2>

        <p>Awak dah selesai membaca ayat!</p>

        <div class="result-score">
            <span id="finalScore">0</span>/10
        </div>

        <div id="finalStars" style="font-size:35px;">
            ⭐⭐⭐⭐⭐
        </div>

        <p id="finalMessage"></p>

        <button class="replay" onclick="restartGame()">
            🔄 Main Lagi
        </button>

    </div>

</div>

<div class="celebration" id="celebration">
    🎉 ⭐ ✨ ⭐ 🎉
</div>

<script>

const questions = [

    {
        sentence: "Ini bola.",
        emoji: "⚽",
        answers: [
            "Ini bola.",
            "Ini buku.",
            "Ini baju.",
            "Ini topi."
        ]
    },

    {
        sentence: "Ini buku.",
        emoji: "📚",
        answers: [
            "Ini bola.",
            "Ini buku.",
            "Ini susu.",
            "Ini roti."
        ]
    },

    {
        sentence: "Ini baju.",
        emoji: "👕",
        answers: [
            "Ini baju.",
            "Ini bola.",
            "Ini buku.",
            "Ini sapu."
        ]
    },

    {
        sentence: "Ini topi.",
        emoji: "🧢",
        answers: [
            "Ini susu.",
            "Ini topi.",
            "Ini roti.",
            "Ini bola."
        ]
    },

    {
        sentence: "Ini susu.",
        emoji: "🥛",
        answers: [
            "Ini susu.",
            "Ini buku.",
            "Ini topi.",
            "Ini baju."
        ]
    },

    {
        sentence: "Ini roti.",
        emoji: "🍞",
        answers: [
            "Ini roti.",
            "Ini bola.",
            "Ini susu.",
            "Ini buku."
        ]
    },

    {
        sentence: "Ali ada bola.",
        emoji: "👦⚽",
        answers: [
            "Ali ada bola.",
            "Ali ada buku.",
            "Ali ada topi.",
            "Ali ada roti."
        ]
    },

    {
        sentence: "Ali ada buku.",
        emoji: "👦📚",
        answers: [
            "Ali ada bola.",
            "Ali ada buku.",
            "Ali ada baju.",
            "Ali ada susu."
        ]
    },

    {
        sentence: "Siti ada bola.",
        emoji: "👧⚽",
        answers: [
            "Siti ada bola.",
            "Siti ada buku.",
            "Siti ada roti.",
            "Siti ada topi."
        ]
    },

    {
        sentence: "Siti ada buku.",
        emoji: "👧📚",
        answers: [
            "Siti ada buku.",
            "Siti ada bola.",
            "Siti ada baju.",
            "Siti ada susu."
        ]
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;


function speak(text) {

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "ms-MY";
        speech.rate = 0.8;
        speech.pitch = 1.1;

        speechSynthesis.speak(speech);
    }
}


function speakSentence() {

    const current =
        questions[currentQuestion];

    speak(current.sentence);
}


function loadQuestion() {

    answered = false;

    const current =
        questions[currentQuestion];

    document.getElementById("sentence").textContent =
        current.sentence;

    document.getElementById("emoji").textContent =
        current.emoji;

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextButton").style.display =
        "none";

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    current.answers.forEach(answer => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {
            checkAnswer(answer, button);
        };

        answers.appendChild(button);

    });
}


function checkAnswer(answer, button) {

    if (answered) return;

    answered = true;

    const current =
        questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".answer");

    allButtons.forEach(btn => {
        btn.disabled = true;
    });

    if (answer === current.sentence) {

        score++;

        button.classList.add("correct");

        document.getElementById("score").textContent =
            score;

        document.getElementById("feedback").textContent =
            "🎉 Betul! Hebat!";

        speak("Betul! " + current.sentence);

        showCelebration();

    } else {

        button.classList.add("wrong");

        allButtons.forEach(btn => {

            if (btn.textContent === current.sentence) {
                btn.classList.add("correct");
            }

        });

        document.getElementById("feedback").textContent =
            "😊 Cuba lagi! Jawapan betul ialah " +
            current.sentence;

        speak("Cuba lagi!");

    }

    document.getElementById("nextButton").style.display =
        "inline-block";
}


function showCelebration() {

    const celebration =
        document.getElementById("celebration");

    celebration.classList.remove("celebrate");

    void celebration.offsetWidth;

    celebration.classList.add("celebrate");

    setTimeout(() => {
        celebration.classList.remove("celebrate");
    }, 1000);
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showResult();

    } else {

        loadQuestion();

        setTimeout(() => {
            speakSentence();
        }, 300);

    }
}


function showResult() {

    document.getElementById("gameCard").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        score;

    let stars = "";

    if (score >= 9) {

        stars = "⭐⭐⭐⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Wah, hebat sangat! 🌟";

    } else if (score >= 7) {

        stars = "⭐⭐⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Bagus! Teruskan membaca! 😊";

    } else if (score >= 5) {

        stars = "⭐⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Bagus! Cuba lagi untuk lebih banyak bintang! 💪";

    } else {

        stars = "⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Tak apa! Jom cuba lagi! 🌈";

    }

    document.getElementById("finalStars").textContent =
        stars;

    speak("Tahniah! Jom cuba lagi!");

}


function restartGame() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("score").textContent =
        "0";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("gameCard").style.display =
        "block";

    loadQuestion();

    speakSentence();
}


loadQuestion();

</script>

</body>
</html>
