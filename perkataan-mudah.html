<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jom Belajar - Perkataan Mudah</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff3d6, #e7f7ff);
    color: #333;
    text-align: center;
}

header {
    background: white;
    padding: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    color: #666;
}

.game {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.info {
    display: flex;
    justify-content: space-between;
    background: white;
    padding: 15px 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    font-weight: bold;
}

.card,
.result {
    background: white;
    border-radius: 25px;
    padding: 35px 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.emoji {
    font-size: 75px;
}

.instruction {
    font-size: 20px;
    margin: 15px 0;
}

.word {
    font-size: 60px;
    font-weight: bold;
    color: #ff7a00;
    letter-spacing: 5px;
    margin: 20px 0;
}

.listen {
    border: none;
    background: #6c63ff;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    border: 3px solid #eee;
    background: #fafafa;
    padding: 18px;
    border-radius: 18px;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
}

.answer:hover {
    transform: scale(1.03);
}

.answer.correct {
    background: #b9f6c3;
    border-color: #39a852;
}

.answer.wrong {
    background: #ffc5c5;
    border-color: #e74c3c;
}

.feedback {
    min-height: 45px;
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}

.next {
    display: none;
    margin-top: 20px;
    border: none;
    background: #ff9f1c;
    color: white;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

.result {
    display: none;
}

.result h2 {
    font-size: 32px;
}

.result-score {
    font-size: 50px;
    font-weight: bold;
    color: #ff7a00;
    margin: 20px;
}

.replay {
    border: none;
    background: #6c63ff;
    color: white;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

.celebration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    z-index: 10;
}

.celebrate {
    display: flex;
    animation: celebrate 1s ease;
}

@keyframes celebrate {
    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }

    100% {
        opacity: 0;
        transform: scale(1.8);
    }
}

@media (max-width: 600px) {

    .game {
        padding: 15px;
    }

    .word {
        font-size: 48px;
    }

    .answer {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📝 Jom Baca Perkataan!</h1>
    <p>Kenal dan baca perkataan mudah 🎮</p>
</header>

<div class="game">

    <div class="info">
        <div>⭐ Skor: <span id="score">0</span></div>
        <div>Soalan: <span id="questionNumber">1</span>/10</div>
    </div>

    <div class="card" id="gameCard">

        <div class="emoji" id="emoji">👕</div>

        <div class="instruction">
            Apakah perkataan ini?
        </div>

        <div class="word" id="word">
            BAJU
        </div>

        <button class="listen" onclick="speakWord()">
            🔊 Dengar Perkataan
        </button>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next" id="nextButton" onclick="nextQuestion()">
            Soalan Seterusnya ➡️
        </button>

    </div>

    <div class="result" id="result">

        <div style="font-size:70px;">🎉</div>

        <h2>Tahniah!</h2>

        <p>Awak dah selesai membaca!</p>

        <div class="result-score">
            <span id="finalScore">0</span>/10
        </div>

        <div id="finalStars" style="font-size:35px;">
            ⭐⭐⭐⭐⭐
        </div>

        <p id="finalMessage"></p>

        <button class="replay" onclick="restartGame()">
            🔄 Main Lagi
        </button>

    </div>

</div>

<div class="celebration" id="celebration">
    🎉 ⭐ ✨ ⭐ 🎉
</div>

<script>

const questions = [

    {
        word: "BAJU",
        emoji: "👕",
        answers: ["BAJU", "BOLA", "BUKU", "MATA"]
    },

    {
        word: "BOLA",
        emoji: "⚽",
        answers: ["BOLA", "KUDA", "ROTI", "BAJU"]
    },

    {
        word: "BUKU",
        emoji: "📚",
        answers: ["BUKU", "MATA", "KAKI", "SUSU"]
    },

    {
        word: "KUDA",
        emoji: "🐴",
        answers: ["KUDA", "BOLA", "TOPI", "MATA"]
    },

    {
        word: "MATA",
        emoji: "👀",
        answers: ["MATA", "KAKI", "BAJU", "BUKU"]
    },

    {
        word: "KAKI",
        emoji: "🦶",
        answers: ["KAKI", "KUDA", "ROTI", "SUSU"]
    },

    {
        word: "ROTI",
        emoji: "🍞",
        answers: ["ROTI", "BOLA", "BAJU", "MATA"]
    },

    {
        word: "SUSU",
        emoji: "🥛",
        answers: ["SUSU", "BUKU", "KUDA", "TOPI"]
    },

    {
        word: "SAPU",
        emoji: "🧹",
        answers: ["SAPU", "BAJU", "ROTI", "MATA"]
    },

    {
        word: "TOPI",
        emoji: "🧢",
        answers: ["TOPI", "KAKI", "BUKU", "SUSU"]
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;


function speak(text) {

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "ms-MY";
        speech.rate = 0.8;
        speech.pitch = 1.1;

        speechSynthesis.speak(speech);
    }
}


function speakWord() {

    const current =
        questions[currentQuestion];

    speak(current.word);
}


function loadQuestion() {

    answered = false;

    const current =
        questions[currentQuestion];

    document.getElementById("word").textContent =
        current.word;

    document.getElementById("emoji").textContent =
        current.emoji;

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextButton").style.display =
        "none";

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    current.answers.forEach(answer => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {
            checkAnswer(answer, button);
        };

        answers.appendChild(button);

    });
}


function checkAnswer(answer, button) {

    if (answered) return;

    answered = true;

    const current =
        questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".answer");

    allButtons.forEach(btn => {
        btn.disabled = true;
    });

    if (answer === current.word) {

        score++;

        button.classList.add("correct");

        document.getElementById("score").textContent =
            score;

        document.getElementById("feedback").textContent =
            "🎉 Betul! Hebat!";

        speak("Betul! " + current.word);

        showCelebration();

    } else {

        button.classList.add("wrong");

        allButtons.forEach(btn => {

            if (btn.textContent === current.word) {
                btn.classList.add("correct");
            }

        });

        document.getElementById("feedback").textContent =
            "😊 Cuba lagi! Jawapan betul ialah " +
            current.word;

        speak("Cuba lagi!");

    }

    document.getElementById("nextButton").style.display =
        "inline-block";
}


function showCelebration() {

    const celebration =
        document.getElementById("celebration");

    celebration.classList.remove("celebrate");

    void celebration.offsetWidth;

    celebration.classList.add("celebrate");

    setTimeout(() => {
        celebration.classList.remove("celebrate");
    }, 1000);
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showResult();

    } else {

        loadQuestion();

        setTimeout(() => {
            speakWord();
        }, 300);

    }
}


function showResult() {
    localStorage.setItem("membacaTahap5", "selesai");       

    document.getElementById("gameCard").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        score;

    let stars = "";

    if (score >= 9) {

        stars = "⭐⭐⭐⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Wah, hebat sangat! 🌟";

    } else if (score >= 7) {

        stars = "⭐⭐⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Bagus! Teruskan membaca! 😊";

    } else if (score >= 5) {

        stars = "⭐⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Bagus! Cuba lagi untuk lebih banyak bintang! 💪";

    } else {

        stars = "⭐⭐";

        document.getElementById("finalMessage").textContent =
            "Tak apa! Jom cuba lagi! 🌈";

    }

    document.getElementById("finalStars").textContent =
        stars;

    speak("Tahniah! Jom cuba lagi!");

}


function restartGame() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("score").textContent =
        "0";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("gameCard").style.display =
        "block";

    loadQuestion();

    speakWord();
}


loadQuestion();

</script>

</body>
</html>
