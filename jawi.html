<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jom Jawi! | Jom Belajar</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        .game {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff7b54;
            font-size: 40px;
        }

        .score {
            font-size: 20px;
        }

        .progress {
            color: #888;
            margin: 15px;
        }

        .question {
            font-size: 22px;
            color: #555;
            margin: 20px;
        }

        .jawi-letter {
            font-size: 100px;
            margin: 30px;
            color: #70c1b3;
            direction: rtl;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .answer {
            background: #ffd166;
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-size: 45px;
            cursor: pointer;
            direction: rtl;
        }

        .answer:hover {
            transform: scale(1.05);
        }

        .feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
        }

        button {
            font-family: Arial, sans-serif;
        }

        .next,
        .restart {
            background: #70c1b3;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 20px;
            margin-top: 20px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .final-score {
            font-size: 28px;
            font-weight: bold;
            color: #ff7b54;
            margin: 20px;
        }

        .stars {
            font-size: 35px;
            margin: 15px;
        }

    </style>

</head>

<body>

<div class="game">

    <div id="gameScreen">

        <h1>🕌 Jom Jawi!</h1>

        <div class="score">
            ⭐ Markah:
            <span id="score">0</span>
        </div>

        <div class="progress">
            Soalan
            <span id="questionNumber">1</span>
            / 10
        </div>

        <div class="question">
            Huruf Jawi apakah ini?
        </div>

        <div class="jawi-letter" id="jawiLetter">
            ا
        </div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button
            class="next hidden"
            id="nextButton"
            onclick="nextQuestion()">

            Soalan Seterusnya ➡️

        </button>

    </div>


    <div id="resultScreen" class="hidden">

        <div style="font-size:70px;">
            🎉
        </div>

        <h1>Tahniah!</h1>

        <div class="final-score">

            Markah kamu:
            <br>

            <span id="finalScore"></span> / 10

        </div>

        <div class="stars" id="finalStars">
            ☆☆☆☆☆
        </div>

        <p id="resultMessage"></p>

        <button
            class="restart"
            onclick="location.reload()">

            🔄 Main Lagi

        </button>

    </div>

</div>


<script>

let score = 0;
let questionNumber = 0;
let correctAnswer = "";


/*
Huruf Jawi asas yang kita gunakan
untuk permainan pertama.
*/

const jawiLetters = [

    {
        jawi: "ا",
        name: "Alif"
    },

    {
        jawi: "ب",
        name: "Ba"
    },

    {
        jawi: "ت",
        name: "Ta"
    },

    {
        jawi: "ث",
        name: "Tha"
    },

    {
        jawi: "ج",
        name: "Jim"
    },

    {
        jawi: "چ",
        name: "Ca"
    },

    {
        jawi: "د",
        name: "Dal"
    },

    {
        jawi: "ر",
        name: "Ra"
    },

    {
        jawi: "س",
        name: "Sin"
    },

    {
        jawi: "م",
        name: "Mim"
    }

];


function createQuestion() {

    document.getElementById("feedback")
        .innerText = "";

    document.getElementById("nextButton")
        .classList.add("hidden");


    let current =
        jawiLetters[questionNumber];


    correctAnswer =
        current.name;


    document.getElementById("jawiLetter")
        .innerText = current.jawi;


    let answers = [

        current.name,

        getWrongAnswer(),

        getWrongAnswer(),

        getWrongAnswer()

    ];


    answers = [...new Set(answers)];


    while (answers.length < 4) {

        answers.push(
            jawiLetters[
                Math.floor(
                    Math.random() *
                    jawiLetters.length
                )
            ].name
        );

        answers = [...new Set(answers)];

    }


    answers.sort(
        () => Math.random() - 0.5
    );


    let answerArea =
        document.getElementById("answers");


    answerArea.innerHTML = "";


    answers.forEach(function(answer) {

        let button =
            document.createElement("button");

        button.className = "answer";

        button.innerText = answer;

        button.onclick = function() {

            checkAnswer(answer);

        };

        answerArea.appendChild(button);

    });


    document.getElementById("questionNumber")
        .innerText = questionNumber + 1;

}


function getWrongAnswer() {

    let answer;

    do {

        answer =
            jawiLetters[
                Math.floor(
                    Math.random() *
                    jawiLetters.length
                )
            ].name;

    }

    while (answer === correctAnswer);

    return answer;

}


function checkAnswer(answer) {

    let feedback =
        document.getElementById("feedback");


    if (answer === correctAnswer) {

        score++;

        feedback.innerText =
            "🎉 Betul! Hebat!";

    }

    else {

        feedback.innerText =
            "😊 Cuba lagi!";

    }


    document.getElementById("score")
        .innerText = score;


    document.getElementById("nextButton")
        .classList.remove("hidden");


    let buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(function(button) {

        button.disabled = true;

    });

}


function nextQuestion() {

    questionNumber++;


    if (questionNumber >= 10) {

        showResult();

        return;

    }


    createQuestion();

}


function showResult() {

    document.getElementById("gameScreen")
        .classList.add("hidden");


    document.getElementById("resultScreen")
        .classList.remove("hidden");


    document.getElementById("finalScore")
        .innerText = score;


    let starCount =
        Math.ceil(score / 2);


    let stars = "";


    for (let i = 0; i < 5; i++) {

        if (i < starCount) {

            stars += "⭐";

        } else {

            stars += "☆";

        }

    }


    document.getElementById("finalStars")
        .innerText = stars;


    let message;


    if (score === 10) {

        message =
            "🏆 Hebat! Semua betul!";

    }

    else if (score >= 7) {

        message =
            "🌟 Bagus! Teruskan berlatih!";

    }

    else if (score >= 5) {

        message =
            "😊 Bagus! Cuba lagi!";

    }

    else {

        message =
            "💪 Jangan putus asa!";

    }


    document.getElementById("resultMessage")
        .innerText = message;

}


createQuestion();

</script>

</body>

</html>
