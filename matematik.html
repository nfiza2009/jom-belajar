<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jom Kira! | Jom Belajar</title>

    <style>
        .celebration {
    font-size: 40px;
    min-height: 50px;
    margin-top: 10px;
}

.celebrate {
    animation: celebrate 0.7s ease;
}

@keyframes celebrate {

    0% {
        transform: scale(0);
        opacity: 0;
    }

    50% {
        transform: scale(1.4);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }

}
        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        .game {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff7b54;
            font-size: 40px;
        }

        h2 {
            color: #555;
        }

        .subtitle {
            color: #777;
            font-size: 18px;
        }

        .age-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .age-button {
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 22px;
            cursor: pointer;
            background: #ffd166;
        }

        .age-button:hover {
            transform: scale(1.03);
        }

        .score {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .progress {
            color: #888;
            margin-bottom: 15px;
        }

        .stars {
            font-size: 32px;
            margin: 15px;
        }

        .fruit {
            font-size: 45px;
            margin: 15px;
        }

        .question {
            font-size: 42px;
            font-weight: bold;
            margin: 25px 0;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .answer {
            background: #ffd166;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 25px;
            cursor: pointer;
        }

        .answer:hover {
    transform: scale(1.05);
}

.answer.correct {
    background: #8fd694;
    color: white;
    transform: scale(1.05);
}

.answer.wrong {
    background: #ff8a80;
    color: white;
}

.feedback {
    animation: pop 0.4s ease;
}

@keyframes pop {
    0% {
        transform: scale(0.8);
        opacity: 0;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

        .feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
        }

        .next,
        .restart {
            background: #70c1b3;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 20px;
            margin-top: 20px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .final-score {
            font-size: 28px;
            font-weight: bold;
            margin: 20px;
            color: #ff7b54;
        }

        .emoji-result {
            font-size: 60px;
        }
    </style>
</head>

<body>

<div class="game">

    <!-- PILIH UMUR -->

    <div id="ageScreen">

        <h1>🌈 Jom Kira!</h1>

        <p class="subtitle">
            Pilih umur kamu untuk mula bermain 🎮
        </p>

        <div class="age-buttons">

            <button class="age-button" onclick="startGame(4)">
                👶 Umur 3–4 Tahun
            </button>

            <button class="age-button" onclick="startGame(6)">
                🧒 Umur 5–6 Tahun
            </button>

            <button class="age-button" onclick="startGame(7)">
                👦 Umur 7+ Tahun
            </button>

        </div>

    </div>


    <!-- GAME -->

    <div id="gameScreen" class="hidden">

        <h1>🍎 Jom Kira!</h1>

        <div class="score">
            ⭐ Markah: <span id="score">0</span>
        </div>

        <div class="progress">
            Soalan <span id="questionNumber">1</span> / 10
        </div>

        <div class="stars" id="stars">
            ☆☆☆☆☆
        </div>

        <div class="fruit">
            🍎 🍎 🍎
        </div>

        <div class="question" id="question">
            1 + 2 = ?
        </div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>
        <div class="celebration" id="celebration"></div>

        <button
            class="next hidden"
            id="nextButton"
            onclick="nextQuestion()">
            Soalan Seterusnya ➡️
        </button>

    </div>


    <!-- KEPUTUSAN -->

    <div id="resultScreen" class="hidden">

        <div class="emoji-result">
            🎉
        </div>

        <h1>Tahniah!</h1>

        <p class="final-score">
            Markah kamu:
            <br>
            <span id="finalScore"></span> / 10
        </p>

        <div class="stars" id="finalStars">
            ☆☆☆☆☆
        </div>

        <p id="resultMessage"></p>

        <button
            class="restart"
            onclick="location.reload()">
            🔄 Main Lagi
        </button>

    </div>

</div>


<script>

let score = 0;
let questionNumber = 0;
let correctAnswer = 0;
let selectedAge = 4;


// MULA GAME

function startGame(age) {

    selectedAge = age;

    document.getElementById("ageScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    createQuestion();
}


// CIPTA SOALAN

function createQuestion() {

    document.getElementById("feedback").innerText = "";
    document.getElementById("celebration").innerText = "";

    document.getElementById("nextButton")
        .classList.add("hidden");


    let number1;
    let number2;


    // UMUR 3–4

    if (selectedAge === 4) {

        number1 = Math.floor(Math.random() * 5) + 1;
        number2 = Math.floor(Math.random() * 5) + 1;

    }


    // UMUR 5–6

    else if (selectedAge === 6) {

        number1 = Math.floor(Math.random() * 10) + 1;
        number2 = Math.floor(Math.random() * 10) + 1;

    }


    // UMUR 7+

    else {

        number1 = Math.floor(Math.random() * 20) + 1;
        number2 = Math.floor(Math.random() * 20) + 1;

    }


    correctAnswer = number1 + number2;


    document.getElementById("question").innerText =
        number1 + " + " + number2 + " = ?";


    let answers = [
        correctAnswer,
        correctAnswer + 1,
        correctAnswer - 1,
        correctAnswer + 2
    ];


    answers.sort(() => Math.random() - 0.5);


    let answerArea =
        document.getElementById("answers");


    answerArea.innerHTML = "";


    answers.forEach(function(answer) {

        if (answer >= 0) {

            let button =
                document.createElement("button");

            button.className = "answer";

            button.innerText = answer;

            button.onclick = function() {

                checkAnswer(answer);

            };

            answerArea.appendChild(button);

        }

    });


    document.getElementById("questionNumber")
        .innerText = questionNumber + 1;
}


// SEMAK JAWAPAN

function checkAnswer(answer) {

    let feedback =
        document.getElementById("feedback");

    let buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(function(button) {

        button.disabled = true;

    });


    if (answer === correctAnswer) {

        score++;

        feedback.innerText =
            "🎉 Betul! Hebat!";

        speak("Betul! Hebat!");
        let celebration =
    document.getElementById("celebration");

celebration.innerText = "🎉 ⭐ ✨ ⭐ 🎉";

celebration.classList.remove("celebrate");

void celebration.offsetWidth;

celebration.classList.add("celebrate");


        buttons.forEach(function(button) {

            if (Number(button.innerText) === correctAnswer) {

                button.classList.add("correct");

            }

        });

    }

    else {

        feedback.innerText =
            "😊 Cuba lagi! Jawapan betul ialah "
            + correctAnswer;

        speak("Cuba lagi!");


        buttons.forEach(function(button) {

            if (Number(button.innerText) === answer) {

                button.classList.add("wrong");

            }

            if (Number(button.innerText) === correctAnswer) {

                button.classList.add("correct");

            }

        });

    }


    document.getElementById("score")
        .innerText = score;


    updateStars();


    document.getElementById("nextButton")
        .classList.remove("hidden");

}


// BINTANG

function updateStars() {

    let stars = "";


    for (let i = 0; i < 5; i++) {

        if (i < Math.min(score, 5)) {

            stars += "⭐";

        }

        else {

            stars += "☆";

        }

    }


    document.getElementById("stars")
        .innerText = stars;
}


// SOALAN SETERUSNYA

function nextQuestion() {

    questionNumber++;


    if (questionNumber >= 10) {

        showResult();

        return;

    }


    createQuestion();
}


// KEPUTUSAN

function showResult() {

    document.getElementById("gameScreen")
        .classList.add("hidden");


    document.getElementById("resultScreen")
        .classList.remove("hidden");


    document.getElementById("finalScore")
        .innerText = score;


    let finalStars = "";


    let starCount =
        Math.ceil(score / 2);


    for (let i = 0; i < 5; i++) {

        if (i < starCount) {

            finalStars += "⭐";

        }

        else {

            finalStars += "☆";

        }

    }


    document.getElementById("finalStars")
        .innerText = finalStars;


    let message;


    if (score === 10) {

        message =
            "🏆 Hebat! Semua betul!";

    }

    else if (score >= 7) {

        message =
            "🌟 Bagus! Teruskan berlatih!";

    }

    else if (score >= 5) {

        message =
            "😊 Bagus! Cuba lagi untuk dapat lebih banyak markah!";

    }

    else {

        message =
            "💪 Jangan putus asa! Cuba lagi!";

    }


    document.getElementById("resultMessage")
        .innerText = message;
}
// SUARA
function speak(text) {

    if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

        let speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "ms-MY";
        speech.rate = 0.9;
        speech.pitch = 1.1;

        window.speechSynthesis.speak(speech);

    }

}
</script>

</body>
</html>
