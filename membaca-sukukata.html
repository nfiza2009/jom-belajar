<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jom Belajar - Suku Kata</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fff7d6, #e8f7ff);
        color: #333;
        text-align: center;
    }

    header {
        background: white;
        padding: 20px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    header h1 {
        margin: 0;
        font-size: 30px;
    }

    header p {
        margin: 8px 0 0;
        color: #666;
    }

    .game {
        max-width: 700px;
        margin: 30px auto;
        padding: 25px;
    }

    .info {
        display: flex;
        justify-content: space-between;
        background: white;
        padding: 15px 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        font-weight: bold;
        box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .card {
        background: white;
        border-radius: 25px;
        padding: 35px 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .emoji {
        font-size: 60px;
    }

    .instruction {
        font-size: 20px;
        margin: 15px 0;
    }

    .syllable {
        font-size: 70px;
        font-weight: bold;
        color: #ff7a00;
        margin: 20px 0;
    }

    .listen {
        border: none;
        background: #6c63ff;
        color: white;
        padding: 12px 22px;
        border-radius: 30px;
        font-size: 17px;
        cursor: pointer;
        margin-bottom: 25px;
    }

    .listen:hover {
        opacity: 0.9;
    }

    .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .answer {
        border: 3px solid #eee;
        background: #fafafa;
        padding: 20px;
        border-radius: 18px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .answer:hover {
        transform: scale(1.03);
        background: #f0f8ff;
    }

    .answer.correct {
        background: #b9f6c3;
        border-color: #39a852;
    }

    .answer.wrong {
        background: #ffc5c5;
        border-color: #e74c3c;
    }

    .feedback {
        min-height: 35px;
        margin-top: 20px;
        font-size: 21px;
        font-weight: bold;
    }

    .next {
        display: none;
        margin-top: 20px;
        border: none;
        background: #ff9f1c;
        color: white;
        padding: 14px 30px;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
    }

    .stars {
        font-size: 25px;
        margin-top: 10px;
    }

    .result {
        display: none;
        background: white;
        border-radius: 25px;
        padding: 40px 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .result h2 {
        font-size: 32px;
    }

    .result-score {
        font-size: 50px;
        font-weight: bold;
        color: #ff7a00;
        margin: 20px;
    }

    .replay {
        border: none;
        background: #6c63ff;
        color: white;
        padding: 14px 30px;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
    }

    .celebration {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 55px;
        z-index: 10;
    }

    .celebrate {
        display: flex;
        animation: celebrate 1s ease;
    }

    @keyframes celebrate {
        0% {
            opacity: 0;
            transform: scale(0.5);
        }

        50% {
            opacity: 1;
            transform: scale(1.3);
        }

        100% {
            opacity: 0;
            transform: scale(1.8);
        }
    }

    @media (max-width: 600px) {

        .game {
            margin: 15px auto;
            padding: 15px;
        }

        .syllable {
            font-size: 60px;
        }

        .answers {
            grid-template-columns: 1fr 1fr;
        }

        .answer {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>📖 Jom Belajar Suku Kata!</h1>
    <p>Belajar membaca sambil bermain 🎮</p>
</header>

<div class="game">

    <div class="info">
        <div>⭐ Skor: <span id="score">0</span></div>
        <div>Soalan: <span id="questionNumber">1</span>/10</div>
    </div>

    <div class="card" id="gameCard">

        <div class="emoji" id="emoji">📚</div>

        <div class="instruction">
            Suku kata apakah ini?
        </div>

        <div class="syllable" id="syllable">
            BA
        </div>

        <button class="listen" onclick="speakSyllable()">
            🔊 Dengar
        </button>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <div class="stars" id="stars">
            ⭐
        </div>

        <button class="next" id="nextButton" onclick="nextQuestion()">
            Soalan Seterusnya ➡️
        </button>

    </div>

    <div class="result" id="result">

        <div style="font-size:70px;">🎉</div>

        <h2>Tahniah!</h2>

        <p>Awak dah selesai bermain.</p>

        <div class="result-score">
            <span id="finalScore">0</span>/10
        </div>

        <div id="finalStars" style="font-size:35px;">
            ⭐⭐⭐⭐⭐
        </div>

        <p id="finalMessage"></p>

        <button class="replay" onclick="restartGame()">
            🔄 Main Lagi
        </button>

    </div>

</div>

<div class="celebration" id="celebration">
    🎉 ⭐ ✨ ⭐ 🎉
</div>

<script>

const questions = [
    {
        syllable: "BA",
        answers: ["BA", "MA", "SA", "LA"],
        emoji: "👶"
    },
    {
        syllable: "MA",
        answers: ["RA", "MA", "DA", "BA"],
        emoji: "👩"
    },
    {
        syllable: "SA",
        answers: ["SA", "TA", "KA", "NA"],
        emoji: "☀️"
    },
    {
        syllable: "LA",
        answers: ["PA", "LA", "CA", "JA"],
        emoji: "🦁"
    },
    {
        syllable: "BI",
        answers: ["BI", "BU", "BE", "BO"],
        emoji: "📚"
    },
    {
        syllable: "MI",
        answers: ["MO", "MA", "MI", "MU"],
        emoji: "🐱"
    },
    {
        syllable: "SU",
        answers: ["SO", "SE", "SI", "SU"],
        emoji: "☂️"
    },
    {
        syllable: "BO",
        answers: ["BU", "BI", "BA", "BO"],
        emoji: "⚽"
    },
    {
        syllable: "KU",
        answers: ["KA", "KI", "KU", "KE"],
        emoji: "📖"
    },
    {
        syllable: "TA",
        answers: ["DA", "TA", "SA", "NA"],
        emoji: "🧸"
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

function speak(text) {

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "ms-MY";
        speech.rate = 0.8;
        speech.pitch = 1.1;

        speechSynthesis.speak(speech);
    }
}

function speakSyllable() {

    const current = questions[currentQuestion];

    speak(current.syllable);
}

function loadQuestion() {

    answered = false;

    const current = questions[currentQuestion];

    document.getElementById("syllable").textContent = current.syllable;

    document.getElementById("emoji").textContent = current.emoji;

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextButton").style.display = "none";

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";

    current.answers.forEach(answer => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {
            checkAnswer(answer, button);
        };

        answersContainer.appendChild(button);

    });

    document.getElementById("stars").textContent =
        "⭐".repeat(Math.min(score + 1, 5));
}

function checkAnswer(answer, button) {

    if (answered) return;

    answered = true;

    const current = questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".answer");

    allButtons.forEach(btn => {
        btn.disabled = true;
    });

    if (answer === current.syllable) {

        score++;

        button.classList.add("correct");

        document.getElementById("score").textContent = score;

        document.getElementById("feedback").textContent =
            "🎉 Betul! Hebat!";

        speak("Betul! Hebat!");

        showCelebration();

    } else {

        button.classList.add("wrong");

        allButtons.forEach(btn => {

            if (btn.textContent === current.syllable) {
                btn.classList.add("correct");
            }

        });

        document.getElementById("feedback").textContent =
            "😊 Cuba lagi! Jawapan betul ialah " +
            current.syllable;

        speak("Cuba lagi!");

    }

    document.getElementById("nextButton").style.display =
        "inline-block";
}

function showCelebration() {

    const celebration =
        document.getElementById("celebration");

    celebration.classList.remove("celebrate");

    void celebration.offsetWidth;

    celebration.classList.add("celebrate");

    setTimeout(() => {
        celebration.classList.remove("celebrate");
    }, 1000);
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showResult();

    } else {

        loadQuestion();

        setTimeout(() => {
            speakSyllable();
        }, 300);
    }
}

function showResult() {
    localStorage.setItem("membacaTahap2", "selesai");

    document.getElementById("gameCard").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent = score;

    let stars = "";

    if (score >= 9) {
        stars = "⭐⭐⭐⭐⭐";
        document.getElementById("finalMessage").textContent =
            "Wah, hebat sangat! 🌟";
    } else if (score >= 7) {
        stars = "⭐⭐⭐⭐";
        document.getElementById("finalMessage").textContent =
            "Bagus! Teruskan belajar! 😊";
    } else if (score >= 5) {
        stars = "⭐⭐⭐";
        document.getElementById("finalMessage").textContent =
            "Bagus! Cuba lagi untuk dapat lebih banyak bintang! 💪";
    } else {
        stars = "⭐⭐";
        document.getElementById("finalMessage").textContent =
            "Tak apa! Jom cuba lagi! 🌈";
    }

    document.getElementById("finalStars").textContent = stars;

    speak("Tahniah! Jom cuba lagi!");

}

function restartGame() {

    currentQuestion = 0;

    score = 0;

    document.getElementById("score").textContent = "0";

    document.getElementById("result").style.display = "none";

    document.getElementById("gameCard").style.display = "block";

    loadQuestion();

    speakSyllable();
}

loadQuestion();

</script>

</body>
</html>
